name: Build Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Java 17 instellen
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: AI Model downloaden
        run: |
          mkdir -p app/src/main/assets
          curl -fL "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite" -o app/src/main/assets/model.tflite
          ls -lh app/src/main/assets/model.tflite


      - name: Android licenties accepteren
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: APK bouwen
        run: |
          GRADLE_FILE=$(find . -name "gradlew" | head -n 1)
          chmod +x "$GRADLE_FILE"
          cd "$(dirname "$GRADLE_FILE")"
          ./gradlew assembleDebug

      - name: APK klaarzetten om te downloaden
        uses: actions/upload-artifact@v4
        with:
          name: Quest-Camera-AI-App
          path: "**/build/outputs/apk/debug/*.apk"
